<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script
        type="text/javascript"
        src="https://js.zohocdn.com/biginsdk/dist/js/bigin-widget-sdk.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            color: #222;
        }

        #status {
            font-size: 16px;
            line-height: 1.5;
        }

        #error {
            margin-top: 12px;
            white-space: pre-wrap;
            color: #b00020;
        }

        #actions {
            display: none;
            margin-top: 22px;
        }

        button {
            padding: 9px 18px;
            margin-right: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 14px;
        }

        #viewButton {
            background: #2f6fed;
            color: white;
            border-color: #2f6fed;
        }

        #regenerateButton {
            background: white;
            color: #333;
        }

        #cancelButton {
            background: white;
            color: #333;
        }

        #manualLink {
            display: none;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <div id="status">Checking for an existing Writer merge...</div>

    <div id="actions">
        <button id="viewButton">View Existing</button>
        <button id="regenerateButton">Regenerate</button>
        <button id="cancelButton">Cancel</button>
    </div>

    <div id="error"></div>

    <a id="manualLink" href="#" target="_blank">
        Open generated document
    </a>

    <script>
        let currentRecordId = null;
        let existingDocumentUrl = null;

        function executeWriterFunction(payload) {
            const requestData = {
                arguments: JSON.stringify(payload)
            };

            return ZOHO.BIGIN.FUNCTIONS.execute(
                "writermerge__writer_merge_function",
                requestData
            );
        }

        function formatDateTime(value) {
            if (!value) {
                return "an earlier time";
            }

            const parsedDate = new Date(value);

            if (isNaN(parsedDate.getTime())) {
                return value;
            }

            return parsedDate.toLocaleString();
        }

        function showError(message) {
            document.getElementById("status").textContent =
                "Unable to generate document.";

            document.getElementById("error").textContent =
                message || "An unexpected error occurred.";

            document.getElementById("actions").style.display = "none";
        }

        function openDocument(url) {
            if (!url) {
                showError("No stored document URL is available.");
                return;
            }

            const newWindow = window.open(url, "_blank");

            if (!newWindow) {
                document.getElementById("status").textContent =
                    "Document ready.";

                const manualLink =
                    document.getElementById("manualLink");

                manualLink.href = url;
                manualLink.style.display = "inline-block";
            }
        }

        function generateDocument() {
            document.getElementById("status").textContent =
                "Generating Writer document...";

            document.getElementById("actions").style.display = "none";
            document.getElementById("error").textContent = "";
            document.getElementById("manualLink").style.display = "none";

            executeWriterFunction({
                record_id: currentRecordId,
                action: "generate"
            }).then(function(response) {

                console.log("Generate response:", response);

                if (response.status === "success" && response.url) {

                    existingDocumentUrl = response.url;

                    document.getElementById("status").textContent =
                        "Document generated. Opening...";

                    openDocument(response.url);

                } else {

                    const message =
                        response.message ||
                        JSON.stringify(response, null, 2);

                    showError(message);
                }

            }).catch(function(error) {

                console.error("Generate error:", error);

                const message =
                    error.message ||
                    JSON.stringify(error, null, 2);

                showError(message);
            });
        }

        function checkExistingMerge() {
            executeWriterFunction({
                record_id: currentRecordId,
                action: "check"
            }).then(function(response) {

                console.log("Check response:", response);

                if (response.status !== "success") {

                    const message =
                        response.message ||
                        JSON.stringify(response, null, 2);

                    showError(message);
                    return;
                }

                if (response.already_merged === true) {

                    existingDocumentUrl = response.existing_url;

                    const mergeDate =
                        formatDateTime(response.last_merge);

                    document.getElementById("status").innerHTML =
                        "A Writer document has already been generated for this record on " +
                        "<strong>" + mergeDate + "</strong>.<br><br>" +
                        "You can open the existing document or generate it again.";

                    document.getElementById("viewButton").style.display =
                        existingDocumentUrl ? "inline-block" : "none";

                    document.getElementById("actions").style.display =
                        "block";

                } else {
                    generateDocument();
                }

            }).catch(function(error) {

                console.error("Check error:", error);

                const message =
                    error.message ||
                    JSON.stringify(error, null, 2);

                showError(message);
            });
        }

        document.getElementById("viewButton")
            .addEventListener("click", function() {
                openDocument(existingDocumentUrl);
            });

        document.getElementById("regenerateButton")
            .addEventListener("click", function() {
                generateDocument();
            });

        document.getElementById("cancelButton")
            .addEventListener("click", function() {
                document.getElementById("status").textContent =
                    "Merge cancelled.";

                document.getElementById("actions").style.display =
                    "none";
            });

        ZOHO.embeddedApp.on("PageLoad", function(data) {

            currentRecordId = data.EntityId;

            if (!currentRecordId) {
                showError(
                    "Unable to identify the current Bigin record."
                );
                return;
            }

            checkExistingMerge();
        });

        ZOHO.embeddedApp.init();
    </script>

</body>
</html>
