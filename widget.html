<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script
        type="text/javascript"
        src="https://js.zohocdn.com/biginsdk/dist/js/bigin-widget-sdk.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            color: #222;
            background: #fff;
        }

        #status {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
        }

        #actions {
            display: none;
            margin-top: 22px;
        }

        button {
            padding: 10px 18px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #c8c8c8;
            background: #fff;
            color: #333;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #f5f5f5;
        }

        #viewExistingButton {
            background: #2f6fed;
            border-color: #2f6fed;
            color: #fff;
        }

        #viewExistingButton:hover {
            background: #245fd4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: #16803c;
        }

        a {
            color: #2f6fed;
        }
    </style>
</head>

<body>

    <div id="status">
        Checking for an existing Writer merge...
    </div>

    <div id="actions">
        <button id="viewExistingButton">View Existing</button>
        <button id="regenerateButton">Regenerate</button>
    </div>

    <script>
        const functionApiName = "writermerge__writer_merge_function";

        let currentRecordId = null;
        let existingDocumentUrl = null;

        function setStatus(message, className) {
            const status = document.getElementById("status");

            status.innerHTML = message;
            status.className = className || "";
        }

        function hideActions() {
            document.getElementById("actions").style.display = "none";
        }

        function showActions() {
            document.getElementById("actions").style.display = "block";
        }

        function executeMergeFunction(action) {
            const requestData = {
                arguments: JSON.stringify({
                    record_id: currentRecordId,
                    action: action
                })
            };

            return ZOHO.BIGIN.FUNCTIONS.execute(
                functionApiName,
                requestData
            );
        }

        function formatMergeDate(value) {
            if (!value) {
                return "";
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-AU", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });
        }

        function generateMerge() {
            hideActions();

            setStatus("Generating Writer document...");

            executeMergeFunction("generate")
                .then(function(response) {
                    console.log("Writer Merge response:", response);

                    if (
                        response.status === "success" &&
                        response.url
                    ) {
                        setStatus(
                            "Writer document generated successfully.",
                            "success"
                        );

                        const newWindow = window.open(
                            response.url,
                            "_blank"
                        );

                        if (!newWindow) {
                            setStatus(
                                'Writer document generated successfully. ' +
                                '<a href="' +
                                response.url +
                                '" target="_blank">Open document</a>',
                                "success"
                            );
                        }
                    }
                    else {
                        setStatus(
                            response.message ||
                            "Unable to generate the Writer document.",
                            "error"
                        );
                    }
                })
                .catch(function(error) {
                    console.error(
                        "Writer Merge generation error:",
                        error
                    );

                    setStatus(
                        "Unable to generate the Writer document.",
                        "error"
                    );
                });
        }

        function checkExistingMerge() {
            setStatus(
                "Checking for an existing Writer merge..."
            );

            executeMergeFunction("check")
                .then(function(response) {
                    console.log(
                        "Writer Merge check response:",
                        response
                    );

                    if (response.status !== "success") {
                        setStatus(
                            response.message ||
                            "Unable to check the existing Writer merge.",
                            "error"
                        );

                        return;
                    }

                    if (response.already_merged) {
                        existingDocumentUrl =
                            response.existing_url;

                        const formattedDate =
                            formatMergeDate(
                                response.last_merge
                            );

                        setStatus(
                            "A Writer document has already been " +
                            "generated for this record on <strong>" +
                            formattedDate +
                            "</strong>.<br><br>" +
                            "You can open the existing document or " +
                            "generate it again."
                        );

                        showActions();
                    }
                    else {
                        generateMerge();
                    }
                })
                .catch(function(error) {
                    console.error(
                        "Writer Merge check error:",
                        error
                    );

                    setStatus(
                        "Unable to check the existing Writer merge.",
                        "error"
                    );
                });
        }

        document
            .getElementById("viewExistingButton")
            .addEventListener(
                "click",
                function() {
                    if (existingDocumentUrl) {
                        window.open(
                            existingDocumentUrl,
                            "_blank"
                        );
                    }
                }
            );

        document
            .getElementById("regenerateButton")
            .addEventListener(
                "click",
                function() {
                    generateMerge();
                }
            );

        ZOHO.embeddedApp.on(
            "PageLoad",
            function(data) {
                console.log(
                    "Writer Merge PageLoad:",
                    data
                );

                if (
                    data &&
                    data.EntityId
                ) {
                    currentRecordId =
                        data.EntityId;

                    checkExistingMerge();
                }
                else {
                    setStatus(
                        "Unable to determine the current Pipeline record.",
                        "error"
                    );
                }
            }
        );

        ZOHO.embeddedApp.init();
    </script>

</body>
</html>
