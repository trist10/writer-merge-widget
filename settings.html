<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script
        type="text/javascript"
        src="https://js.zohocdn.com/biginsdk/dist/js/bigin-widget-sdk.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            color: #222;
            max-width: 700px;
        }

        h2 {
            margin-top: 0;
        }

        .description {
            margin-bottom: 20px;
            line-height: 1.5;
            color: #555;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        button {
            margin-top: 16px;
            padding: 9px 18px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            background: #2f6fed;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #status {
            margin-top: 16px;
            line-height: 1.5;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

    <h2>Writer Merge Settings</h2>

    <div class="description">
        Enter the Zoho Writer merge template you want Writer Merge to use.
        You can paste either the Writer document ID or the full Writer document URL.
    </div>

    <label for="templateInput">Writer merge template</label>

    <input
        id="templateInput"
        type="text"
        placeholder="Paste Writer document ID or URL"
    >

    <button id="saveButton">Save Settings</button>

    <div id="status"></div>

    <script>
        const functionApiName =
            "writermerge__writer_settings_function";

        function setStatus(message, type) {
            const status =
                document.getElementById("status");

            status.textContent = message;
            status.className = type || "";
        }

        function executeSettingsFunction(payload) {

            const requestData = {
                arguments: JSON.stringify(payload)
            };

            return ZOHO.BIGIN.FUNCTIONS.execute(
                functionApiName,
                requestData
            );
        }

        function extractDocumentId(input) {

            const value = input.trim();

            if (!value) {
                return null;
            }

            // Already just a document ID
            if (!value.includes("://")) {
                return value;
            }

            // Full Writer URL
            try {

                const url = new URL(value);

                const parts = url.pathname
                    .split("/")
                    .filter(Boolean);

                const openIndex =
                    parts.indexOf("open");

                if (
                    openIndex !== -1 &&
                    parts.length > openIndex + 1
                ) {
                    return parts[openIndex + 1];
                }

                // Fallback to final path component
                if (parts.length > 0) {
                    return parts[parts.length - 1];
                }

            } catch (e) {
                return null;
            }

            return null;
        }

        function loadSettings() {

            setStatus("Loading current settings...");

            executeSettingsFunction({
                action: "get"
            }).then(function(response) {

                console.log(
                    "Settings response:",
                    response
                );

                if (
                    response.status === "success" &&
                    response.template_id
                ) {

                    document
                        .getElementById("templateInput")
                        .value =
                        response.template_id;

                    setStatus("");

                } else {

                    setStatus(
                        "No Writer template is currently configured.",
                        "error"
                    );
                }

            }).catch(function(error) {

                console.error(
                    "Unable to load settings:",
                    error
                );

                setStatus(
                    "Unable to load the current Writer template.",
                    "error"
                );
            });
        }

        document
            .getElementById("saveButton")
            .addEventListener("click", function() {

                const button =
                    document.getElementById("saveButton");

                const rawValue =
                    document
                        .getElementById("templateInput")
                        .value;

                const documentId =
                    extractDocumentId(rawValue);

                if (!documentId) {

                    setStatus(
                        "Please enter a valid Writer document ID or URL.",
                        "error"
                    );

                    return;
                }

                button.disabled = true;

                setStatus("Saving settings...");

                executeSettingsFunction({
                    action: "set",
                    template_id: documentId
                }).then(function(response) {

                    console.log(
                        "Save response:",
                        response
                    );

                    button.disabled = false;

                    if (response.status === "success") {

                        document
                            .getElementById("templateInput")
                            .value =
                            response.template_id ||
                            documentId;

                        setStatus(
                            "Writer template saved successfully.",
                            "success"
                        );

                    } else {

                        setStatus(
                            response.message ||
                            "Unable to save the Writer template.",
                            "error"
                        );
                    }

                }).catch(function(error) {

                    button.disabled = false;

                    console.error(
                        "Unable to save settings:",
                        error
                    );

                    setStatus(
                        "Unable to save the Writer template.",
                        "error"
                    );
                });
            });

        ZOHO.embeddedApp.on(
            "PageLoad",
            function(data) {
                loadSettings();
            }
        );

        ZOHO.embeddedApp.init();
    </script>

</body>
</html>
