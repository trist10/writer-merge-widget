<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script
        type="text/javascript"
        src="https://js.zohocdn.com/biginsdk/dist/js/bigin-widget-sdk.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            color: #222;
            max-width: 700px;
        }

        h2 {
            margin-top: 0;
        }

        .setup-note {
            background: #f6f8fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .setup-note strong {
            display: block;
            margin-bottom: 8px;
        }

        .description {
            margin-bottom: 20px;
            line-height: 1.5;
            color: #555;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        .checkbox-setting {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            font-weight: 400;
            line-height: 1.5;
        }

        .checkbox-setting input {
            width: auto;
            margin: 4px 0 0;
        }

        .checkbox-setting strong {
            display: block;
        }

        .checkbox-setting small {
            display: block;
            color: #555;
        }

        button {
            margin-top: 16px;
            padding: 9px 18px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            background: #2f6fed;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #status {
            margin-top: 16px;
            line-height: 1.5;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

    <h2>Writer Merge Settings</h2>

    <div class="setup-note">
        <strong>Before using Writer Merge</strong>
        Authorise the Bigin, Zoho Writer and WorkDrive connections for this topping.
        <br><br>
        For first-time setup, paste the full URL of your Zoho Writer merge template
        below.
    </div>

    <div class="description">
        Enter the Zoho Writer merge template you want Writer Merge to use.
    </div>

    <label for="templateInput">Writer merge template</label>

    <input
        id="templateInput"
        disabled
        type="text"
        placeholder="Paste your Zoho Writer document URL">

    <label class="checkbox-setting" for="fillablePdfInput">
        <input id="fillablePdfInput" type="checkbox" disabled>
        <span>
            <strong>Generate fillable PDF</strong>
            <small>Preserve Writer fillable fields in the generated PDF.</small>
        </span>
    </label>

    <button id="saveButton" disabled>Save Settings</button>

    <div id="status"></div>

    <script>
        const functionApiName =
            "writermerge__writer_settings_function";

        let currentApiDomain = null;
        let settingsLoaded = false;

        function setBusy(busy) {
            ["templateInput", "fillablePdfInput", "saveButton"].forEach(function(id) {
                document.getElementById(id).disabled = busy;
            });
        }

        function parseFillablePdf(value) {
            if (value === true || value === "true") return true;
            if (value === false || value === "false") return false;
            return null;
        }

        function setStatus(message, type) {
            const status =
                document.getElementById("status");

            status.textContent = message;
            status.className = type || "";
        }

        function executeSettingsFunction(payload) {
            const requestData = {
                arguments: JSON.stringify(payload)
            };

            return ZOHO.BIGIN.FUNCTIONS.execute(
                functionApiName,
                requestData
            );
        }

        function getApiDomainFromWriterHost(hostname) {
            const host = hostname.toLowerCase();

            if (host === "writer.zoho.com.au") {
                return "https://www.zohoapis.com.au";
            }

            if (host === "writer.zoho.com.cn") {
                return "https://www.zohoapis.com.cn";
            }

            if (host === "writer.zoho.eu") {
                return "https://www.zohoapis.eu";
            }

            if (host === "writer.zoho.in") {
                return "https://www.zohoapis.in";
            }

            if (host === "writer.zoho.jp") {
                return "https://www.zohoapis.jp";
            }

            if (host === "writer.zoho.sa") {
                return "https://www.zohoapis.sa";
            }

            if (
                host === "writer.zoho.ca" ||
                host === "writer.zohocloud.ca"
            ) {
                return "https://www.zohoapis.ca";
            }

            if (host === "writer.zoho.com") {
                return "https://www.zohoapis.com";
            }

            return null;
        }

        function extractTemplateSettings(input) {
            const value = input.trim();

            if (!value) {
                return null;
            }

            if (!value.includes("://")) {
                return {
                    documentId: value,
                    apiDomain: currentApiDomain
                };
            }

            try {
                const url = new URL(value);

                const apiDomain =
                    getApiDomainFromWriterHost(
                        url.hostname
                    );

                if (!apiDomain) {
                    return null;
                }

                const parts =
                    url.pathname
                        .split("/")
                        .filter(Boolean);

                let documentId = null;

                const openIndex =
                    parts.indexOf("open");

                if (
                    openIndex !== -1 &&
                    parts.length > openIndex + 1
                ) {
                    documentId =
                        parts[openIndex + 1];
                }
                else if (parts.length > 0) {
                    documentId =
                        parts[parts.length - 1];
                }

                if (!documentId) {
                    return null;
                }

                return {
                    documentId: documentId,
                    apiDomain: apiDomain
                };
            }
            catch (e) {
                return null;
            }
        }

        function loadSettings() {
            settingsLoaded = false;
            setBusy(true);
            setStatus(
                "Loading current settings..."
            );

            return executeSettingsFunction({
                action: "get"
            })
            .then(function(response) {
                console.log(
                    "Settings response:",
                    response
                );

                if (
                    response.status === "success"
                ) {
                    const fillablePdf = parseFillablePdf(response.fillable_pdf);
                    if (fillablePdf === null) {
                        setStatus("Unable to load the fillable PDF setting. Update the topping's settings function and reopen this page.", "error");
                        return;
                    }
                    currentApiDomain = response.api_domain || null;
                    document.getElementById("fillablePdfInput").checked = fillablePdf;
                    settingsLoaded = true;
                    setBusy(false);

                    if (response.template_id) {
                        document
                            .getElementById(
                                "templateInput"
                            )
                            .value =
                                response.template_id;

                        setStatus("");
                    }
                    else {
                        setStatus(
                            "No Writer template is currently configured.",
                            "error"
                        );
                    }
                }
                else {
                    setStatus(
                        response.message ||
                        "Unable to load the settings. Reopen this page to try again.",
                        "error"
                    );
                }
            })
            .catch(function(error) {
                console.error(
                    "Unable to load settings:",
                    error
                );

                setStatus(
                    "Unable to load the settings. Reopen this page to try again.",
                    "error"
                );
            });
        }

        document
            .getElementById("saveButton")
            .addEventListener(
                "click",
                function() {
                    if (!settingsLoaded || document.getElementById("saveButton").disabled) {
                        return;
                    }
                    const requestedFillablePdf =
                        document.getElementById("fillablePdfInput").checked;

                    const rawValue =
                        document.getElementById(
                            "templateInput"
                        ).value;

                    const settings =
                        extractTemplateSettings(
                            rawValue
                        );

                    if (
                        !settings ||
                        !settings.documentId
                    ) {
                        setStatus(
                            "Please enter a valid Zoho Writer document URL or document ID.",
                            "error"
                        );

                        return;
                    }

                    if (!settings.apiDomain) {
                        setStatus(
                            "For first-time setup, please paste the full Zoho Writer document URL so Writer Merge can identify your data centre.",
                            "error"
                        );

                        return;
                    }

                    setBusy(true);

                    setStatus(
                        "Saving settings..."
                    );

                    executeSettingsFunction({
                        action: "set",
                        template_id:
                            settings.documentId,
                        api_domain:
                            settings.apiDomain,
                        fillable_pdf: requestedFillablePdf
                    })
                    .then(function(response) {
                        console.log(
                            "Save response:",
                            response
                        );


                        if (
                            response.status ===
                            "success"
                        ) {
                            const savedFillablePdf = parseFillablePdf(response.fillable_pdf);
                            if (savedFillablePdf !== requestedFillablePdf) {
                                setStatus("The fillable PDF setting was not confirmed. Reopen settings and try again.", "error");
                                return;
                            }
                            currentApiDomain =
                                response.api_domain ||
                                settings.apiDomain;

                            document.getElementById("fillablePdfInput").checked = savedFillablePdf;

                            document
                                .getElementById(
                                    "templateInput"
                                )
                                .value =
                                    response.template_id ||
                                    settings.documentId;

                            setStatus(
                                "Writer Merge settings saved successfully.",
                                "success"
                            );
                        }
                        else {
                            setStatus(
                                response.message ||
                                "Unable to save the Writer Merge settings.",
                                "error"
                            );
                        }
                    })
                    .catch(function(error) {

                        console.error(
                            "Unable to save settings:",
                            error
                        );

                        setStatus(
                            "Unable to save the Writer Merge settings.",
                            "error"
                        );
                    })
                    .finally(function() {
                        setBusy(false);
                    });
                }
            );

        ZOHO.embeddedApp.on(
            "PageLoad",
            function(data) {
                loadSettings();
            }
        );

        ZOHO.embeddedApp.init();
    </script>

</body>
</html>
